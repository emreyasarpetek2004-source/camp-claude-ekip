<!doctype html>

    <!--
      Reklam çapası düzeltmesi. Reklam linki "#bilgi" ile bitince tarayıcı sayfayı
      açar açmaz en alttaki bilgi formuna hizalıyor; hero (webinar başlığı, geri
      sayım, "WhatsApp Grubuna Katıl") hiç görünmüyor. Reklamdan gelen ziyaretçide
      çapayı sayfa çizilmeden ÖNCE düşürüyoruz — böylece tarayıcının kaydıracağı
      bir hedef kalmıyor. Menüdeki "Bilgi Al" ve elle paylaşılan /#bilgi linkleri
      etkilenmez (onlarda fbclid/utm yok ve referrer Meta değil).
    -->
    <script>
      (function () {
        if (window.location.hash !== "#bilgi") return;
        var query = window.location.search;
        var fromAd =
          /[?&](fbclid|utm_)/i.test(query) ||
          /^https?:\/\/([^/]*\.)?(facebook|instagram|fb)\.(com|me)\//i.test(document.referrer || "");
        if (!fromAd) return;
        window.history.replaceState(null, "", window.location.pathname + query);
        // Bazı tarayıcılar çapa konumunu gezinme başında not ediyor; garanti olsun.
        window.addEventListener("DOMContentLoaded", function () {
          window.scrollTo(0, 0);
        });
      })();
    </script>

    <title>Ekim 2026 Avustralya'da Doktorluk Webinar Takvimi | AUSCAMP</title>
